<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#043c07">
  <title>Farmer Registration - Kamadhenu</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --primary: #043c07;
      --primary-light: #1b5e20;
      --secondary: #ffc107;
      --success: #28a745;
      --danger: #dc3545;
      --gray: #6c757d;
      --border: #e0e0e0;
      --safe-area-top: env(safe-area-inset-top, 0px);
      --safe-area-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Main Container - fits exactly in viewport */
    .register-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px;
      overflow-y: auto;
    }
    
    .register-container::-webkit-scrollbar {
      width: 3px;
    }
    .register-container::-webkit-scrollbar-track {
      background: #e0e0e0;
      border-radius: 10px;
    }
    .register-container::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    /* Logo Section - compact */
    .logo-section {
      text-align: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .app-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 6px;
      box-shadow: 0 4px 12px rgba(4, 60, 7, 0.2);
    }

    .app-icon i {
      font-size: 1.6rem;
      color: white;
    }

    .app-name {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 2px;
    }

    /* Registration Card - compact */
    .register-card {
      background: white;
      border-radius: 20px;
      padding: 16px 18px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }

    .register-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Form Elements - compact */
    .form-group {
      margin-bottom: 10px;
    }

    .form-label {
      display: block;
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
      font-size: 0.75rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: var(--gray);
      font-size: 0.85rem;
    }

    .form-control {
      width: 100%;
      padding: 10px 10px 10px 38px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 0.8rem;
      transition: all 0.2s;
      background: white;
    }

    .form-control:focus {
      border-color: var(--primary);
      outline: none;
      box-shadow: 0 0 0 3px rgba(4, 60, 7, 0.08);
    }

    .form-control::placeholder {
      color: #aaa;
      font-size: 0.75rem;
    }

    /* Photo Upload - compact */
    .photo-upload-area {
      border: 1.5px dashed var(--border);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8f9fa;
    }

    .photo-upload-area:active {
      border-color: var(--primary);
      background: #e8f5e9;
    }

    .photo-upload-area i {
      font-size: 1.5rem;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .photo-upload-area p {
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 2px;
      font-size: 0.75rem;
    }

    .photo-upload-area small {
      color: var(--gray);
      font-size: 0.65rem;
    }

    .photo-preview {
      width: 60px;
      height: 60px;
      border-radius: 30px;
      object-fit: cover;
      border: 2px solid var(--primary);
      margin: 8px auto 0;
      display: none;
    }

    /* Row Layout */
    .row {
      display: flex;
      gap: 10px;
      margin: 0;
    }

    .col {
      flex: 1;
    }

    /* Password Toggle */
    .password-wrapper {
      position: relative;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray);
      cursor: pointer;
      font-size: 0.9rem;
    }

    /* Submit Button */
    .register-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      border: none;
      border-radius: 40px;
      padding: 12px;
      font-weight: 700;
      font-size: 0.9rem;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      margin: 12px 0 10px;
      box-shadow: 0 4px 12px rgba(4, 60, 7, 0.2);
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    /* Login Link */
    .login-section {
      text-align: center;
    }

    .login-text {
      color: var(--gray);
      font-size: 0.75rem;
    }

    .login-link {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .login-link:active {
      opacity: 0.7;
    }

    /* Validation Messages */
    .form-text {
      font-size: 0.65rem;
      margin-top: 2px;
      display: block;
    }

    .text-success {
      color: var(--success);
    }

    .text-danger {
      color: var(--danger);
    }

    .is-invalid {
      border-color: var(--danger) !important;
    }

    .is-valid {
      border-color: var(--success) !important;
    }

    /* Alert Styles */
    .alert {
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .alert-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    /* Language Selector */
    .language-selector {
      position: fixed;
      bottom: 12px;
      right: 12px;
      z-index: 9999;
      background: white;
      padding: 4px 8px;
      border-radius: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .lang-btn {
      padding: 4px 10px;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.7rem;
      cursor: pointer;
    }

    .lang-btn.english {
      background: var(--primary);
      color: white;
    }

    .lang-btn.kannada {
      background: var(--secondary);
      color: var(--primary);
    }

    .lang-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Hide Google Translate */
    .goog-te-banner-frame,
    .goog-te-banner,
    .skiptranslate,
    #google_translate_element {
      display: none !important;
    }

    body {
      top: 0 !important;
    }
  </style>
</head>
<body>
      <input type="hidden" id="currentLang" value="{{ current_lang|default('en') }}">

  <div class="register-container">
    <!-- Logo Section -->
    <div class="logo-section">
      <div class="app-icon">
        <i class="fas fa-cow"></i>
      </div>
      <h1 class="app-name">Kamadhenu</h1>
    </div>

    <!-- Registration Card -->
    <div class="register-card">
      <h2 class="register-title">Farmer Registration</h2>

      <!-- Flash Messages -->
      {% if session.get('register_error') %}
      <div class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="fas fa-exclamation-circle"></i>
        {{ session.pop('register_error') }}
      </div>
      {% endif %}

      {% if session.get('register_success') %}
      <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle"></i>
        {{ session.pop('register_success') }}
      </div>
      {% endif %}

      <!-- Registration Form -->
      <form method="POST" enctype="multipart/form-data" onsubmit="return validateForm()">
        
        <!-- Profile Photo Upload -->
        <div class="form-group">
          <label class="form-label">Profile Photo</label>
          <div class="photo-upload-area" onclick="document.getElementById('photo').click()">
            <i class="fas fa-camera"></i>
            <p>Tap to upload photo</p>
            <small>JPEG, PNG (Max 5MB)</small>
          </div>
          <input type="file" id="photo" name="photo" accept="image/*" style="display: none;" onchange="previewPhoto(event)">
          <img id="photoPreview" class="photo-preview" alt="Photo Preview">
        </div>

        <!-- Full Name -->
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-wrapper">
            <i class="fas fa-user input-icon"></i>
            <input type="text" class="form-control" name="name" id="name" 
                   placeholder="Enter your full name" 
                   pattern="[A-Za-z\s]+" 
                   title="Only letters and spaces allowed" 
                   required>
          </div>
          <small id="nameMessage" class="form-text"></small>
        </div>

        <!-- Email Address -->
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" class="form-control" name="email" id="email" 
                   placeholder="Enter your email" 
                   required>
          </div>
        </div>

        <!-- Phone Number -->
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <div class="input-wrapper">
            <i class="fas fa-phone input-icon"></i>
            <input type="tel" class="form-control" name="phone" id="phone" 
                   placeholder="10-digit mobile number" 
                   minlength="10" maxlength="10" 
                   pattern="[0-9]{10}" 
                   inputmode="numeric"
                   required>
          </div>
        </div>

        <!-- State & City Row -->
        <div class="row">
          <div class="col">
            <div class="form-group">
              <label class="form-label">State</label>
              <div class="input-wrapper">
                <i class="fas fa-map-marker-alt input-icon"></i>
                <input type="text" class="form-control" name="state" id="state" 
                       placeholder="State" 
                       pattern="[A-Za-z\s]+" 
                       required>
              </div>
            </div>
          </div>
          <div class="col">
            <div class="form-group">
              <label class="form-label">City</label>
              <div class="input-wrapper">
                <i class="fas fa-city input-icon"></i>
                <input type="text" class="form-control" name="city" id="city"
                       placeholder="City" 
                       required>
              </div>
            </div>
          </div>
        </div>

        <!-- Address (Optional) -->
        <div class="form-group">
          <label class="form-label">Address (Optional)</label>
          <div class="input-wrapper">
            <i class="fas fa-home input-icon"></i>
            <input type="text" class="form-control" name="address" 
                   placeholder="Enter your address">
          </div>
        </div>

        <!-- Password -->
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" class="form-control" name="password" id="password" 
                   placeholder="Create a password" 
                   required minlength="8">
            <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
          </div>
          <small id="passwordMessage" class="form-text"></small>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="register-btn">
          <i class="fas fa-user-plus"></i>
          Create Account
        </button>
      </form>

      <!-- Login Link -->
      <div class="login-section">
        <p class="login-text">
          Already have an account? 
          <a href="/login" class="login-link">Sign In</a>
        </p>
      </div>
    </div>
  </div>



  <!-- Hidden Google Translate -->
  <div id="google_translate_element" style="display:none;"></div>

  <script>
    // ==================== Password Toggle ====================
    function togglePassword() {
      const password = document.getElementById('password');
      const icon = event.target;
      if (password.type === 'password') {
        password.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        password.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // ==================== Photo Preview ====================
    function previewPhoto(event) {
      const input = event.target;
      const preview = document.getElementById('photoPreview');
      
      if (input.files && input.files[0]) {
        const file = input.files[0];
        
        if (file.size > 5 * 1024 * 1024) {
          alert('File too large! Max 5MB');
          input.value = '';
          return;
        }
        
        if (!file.type.match('image/jpeg') && !file.type.match('image/png')) {
          alert('Please select JPEG or PNG');
          input.value = '';
          return;
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    // ==================== Form Validation ====================
    function validateForm() {
      const email = document.getElementById('email');
      const phone = document.getElementById('phone');
      const password = document.getElementById('password');
      const passwordMessage = document.getElementById('passwordMessage');
      let valid = true;

      // Email validation
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!emailPattern.test(email.value)) {
        email.classList.add('is-invalid');
        valid = false;
      } else {
        email.classList.remove('is-invalid');
      }

      // Phone validation
      const phonePattern = /^[0-9]{10}$/;
      if (!phonePattern.test(phone.value)) {
        phone.classList.add('is-invalid');
        valid = false;
      } else {
        phone.classList.remove('is-invalid');
      }

      // Password validation
      const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;
      if (!passwordPattern.test(password.value)) {
        password.classList.add('is-invalid');
        passwordMessage.textContent = "❌ Must have uppercase, lowercase, number & special character";
        passwordMessage.style.color = "red";
        valid = false;
      } else {
        password.classList.remove('is-invalid');
        password.classList.add('is-valid');
        passwordMessage.textContent = "✅ Password is valid!";
        passwordMessage.style.color = "green";
      }

      return valid;
    }

    // Live validation
    const passwordInput = document.getElementById('password');
    if (passwordInput) {
      passwordInput.addEventListener('input', function() {
        const password = this.value;
        const passwordMessage = document.getElementById('passwordMessage');
        const passwordPattern = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

        if (passwordPattern.test(password)) {
          this.classList.remove('is-invalid');
          this.classList.add('is-valid');
          passwordMessage.textContent = "✅ Password is valid!";
          passwordMessage.style.color = "green";
        } else {
          this.classList.remove('is-valid');
          this.classList.add('is-invalid');
          passwordMessage.textContent = "❌ Must have uppercase, lowercase, number & special character";
          passwordMessage.style.color = "red";
        }
      });
    }

    const nameInput = document.getElementById('name');
    if (nameInput) {
      nameInput.addEventListener('input', function() {
        const name = this.value;
        const nameMessage = document.getElementById('nameMessage');
        const namePattern = /^[A-Za-z\s]+$/;

        if (namePattern.test(name)) {
          this.classList.remove('is-invalid');
          this.classList.add('is-valid');
          nameMessage.textContent = "✅ Name looks good!";
          nameMessage.style.color = "green";
        } else {
          this.classList.remove('is-valid');
          this.classList.add('is-invalid');
          nameMessage.textContent = "❌ Only letters and spaces";
          nameMessage.style.color = "red";
        }
      });
    }

    const phoneInput = document.getElementById('phone');
    if (phoneInput) {
      phoneInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^0-9]/g, '');
      });
    }

    const stateInput = document.getElementById('state');
    if (stateInput) {
      stateInput.addEventListener('input', function() {
        this.value = this.value.replace(/[^A-Za-z\s]/g, '');
      });
    }

    // ==================== Language Functions ====================
    function saveLanguagePreference(lang) {
      localStorage.setItem('selectedLanguage', lang);
      document.cookie = `user_language=${lang}; path=/; max-age=31536000`;
    }

    function applyLanguage(lang) {
      if (lang === 'kn') {
        window.location.hash = '#googtrans(kn|en)';
      } else {
        window.location.hash = '#googtrans(en)';
      }
    }

    function setLanguage(lang) {
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      if (lang === 'en') {
        document.querySelector('.lang-btn.english').classList.add('active');
      } else {
        document.querySelector('.lang-btn.kannada').classList.add('active');
      }
      saveLanguagePreference(lang);
      applyLanguage(lang);
    }

    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,kn',
        autoDisplay: false
      }, 'google_translate_element');
    }

    function loadGoogleTranslate() {
      if (window.google && google.translate) {
        googleTranslateElementInit();
        return;
      }
      var script = document.createElement('script');
      script.src = 'https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
      document.head.appendChild(script);
    }

    // ==================== Initialize ====================
    document.addEventListener('DOMContentLoaded', function() {
      loadGoogleTranslate();
      
      const savedLang = localStorage.getItem('selectedLanguage') || 'en';
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.remove('active');
        if ((savedLang === 'en' && btn.classList.contains('english')) || 
            (savedLang === 'kn' && btn.classList.contains('kannada'))) {
          btn.classList.add('active');
        }
      });
      
      setTimeout(() => applyLanguage(savedLang), 500);
    });
  </script>
</body>
</html>
